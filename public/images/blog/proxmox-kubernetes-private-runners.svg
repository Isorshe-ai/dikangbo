<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Proxmox-backed Kubernetes platform with private GitHub Actions runners</title>
  <desc id="desc">Proxmox virtualization supports an on-premises Kubernetes platform. The cluster hosts development workloads, staging workloads, and private GitHub Actions runners. GitHub workflow jobs target the private runners, which execute inside the cluster environment.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#70d8ee"/>
    </marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#83e6b5"/>
    </marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#edf5fa}
      .title{font-size:24px;font-weight:700}
      .label{font-size:17px;font-weight:700}
      .copy{font-size:14px;fill:#b8c8d3}
      .small{font-size:12px;fill:#b8c8d3}
      .box{fill:#172632;stroke:#3a596b;stroke-width:1.5}
      .cluster{fill:#101c25;stroke:#70d8ee;stroke-width:2}
      .arrow{stroke:#70d8ee;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .green{stroke:#83e6b5;stroke-width:2.5;fill:none;marker-end:url(#green)}
    </style>
  </defs>
  <rect width="1000" height="560" rx="18" fill="#0c141b"/>
  <text x="40" y="52" class="title">Private workloads, familiar delivery paths</text>
  <text x="40" y="78" class="copy">Proxmox provides the on-prem foundation; Kubernetes hosts environments and workflow execution.</text>

  <rect x="40" y="145" width="190" height="112" rx="12" class="box"/>
  <text x="135" y="185" text-anchor="middle" class="label">GitHub</text>
  <text x="135" y="212" text-anchor="middle" class="copy">Workflow dispatch</text>
  <text x="135" y="235" text-anchor="middle" class="small">Authorized jobs only</text>

  <rect x="295" y="105" width="665" height="335" rx="18" class="cluster"/>
  <text x="325" y="141" class="label">On-premises Kubernetes cluster</text>

  <rect x="330" y="175" width="180" height="100" rx="12" class="box"/>
  <text x="420" y="214" text-anchor="middle" class="label">Private runners</text>
  <text x="420" y="241" text-anchor="middle" class="copy">GitHub Actions jobs</text>
  <text x="420" y="261" text-anchor="middle" class="small">Controlled execution</text>
  <path d="M230 201H323" class="green"/>
  <text x="276" y="187" text-anchor="middle" class="small">runner assignment</text>

  <rect x="555" y="175" width="170" height="100" rx="12" class="box"/>
  <text x="640" y="214" text-anchor="middle" class="label">Development</text>
  <text x="640" y="241" text-anchor="middle" class="copy">Workloads</text>
  <path d="M510 225H548" class="arrow"/>

  <rect x="770" y="175" width="155" height="100" rx="12" class="box"/>
  <text x="847" y="214" text-anchor="middle" class="label">Staging</text>
  <text x="847" y="241" text-anchor="middle" class="copy">Workloads</text>
  <path d="M725 225H763" class="arrow"/>

  <rect x="330" y="310" width="595" height="86" rx="12" class="box"/>
  <text x="627" y="344" text-anchor="middle" class="label">Workload and deployment targets</text>
  <text x="627" y="372" text-anchor="middle" class="copy">Environment-scoped permissions · explicit workflow targets · platform-owned operations</text>
  <path d="M420 275V302" class="green"/>

  <rect x="250" y="468" width="760" height="60" rx="12" fill="#132820" stroke="#3b785a"/>
  <text x="630" y="493" text-anchor="middle" class="label">Proxmox virtualization layer</text>
  <text x="630" y="515" text-anchor="middle" class="small">Compute foundation for the self-managed on-premises platform</text>
  <path d="M627 440V460" class="arrow"/>

  <text x="40" y="498" class="copy">Operate the hypervisor, cluster, runner, and workflow permissions as one platform.</text>
</svg>
