<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, Arial, sans-serif"><title id="t">Internal developer platform layers</title><desc id="d">Developers use golden paths and a portal, backed by shared platform capabilities that sit on top of cloud infrastructure.</desc><rect width="760" height="420" rx="12" fill="#121212"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffe0"/></marker></defs><rect x="40" y="24" width="680" height="62" rx="8" fill="#1e1e1e" stroke="#4a5568" stroke-width="2"/><text x="380.0" y="49.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Application teams</text><text x="380.0" y="69.0" text-anchor="middle" font-size="12.5" fill="#b5b5b5">Ship features, own their services</text><line x1="380" y1="86" x2="380" y2="114" stroke="#00ffe0" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="116" width="680" height="70" rx="8" fill="#1e1e1e" stroke="#00ffe0" stroke-width="2"/><text x="380.0" y="145.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Self-service layer</text><text x="380.0" y="165.0" text-anchor="middle" font-size="12.5" fill="#b5b5b5">Portal, templates, golden paths, docs</text><line x1="380" y1="186" x2="380" y2="214" stroke="#00ffe0" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="216" width="161" height="74" rx="8" fill="#1e1e1e" stroke="#4a5568" stroke-width="2"/><text x="120.5" y="247.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">CI/CD</text><text x="120.5" y="267.0" text-anchor="middle" font-size="12.5" fill="#b5b5b5">Build, test, deploy</text><rect x="213" y="216" width="161" height="74" rx="8" fill="#1e1e1e" stroke="#4a5568" stroke-width="2"/><text x="293.5" y="247.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">IaC modules</text><text x="293.5" y="267.0" text-anchor="middle" font-size="12.5" fill="#b5b5b5">Terraform / CloudFormation</text><rect x="386" y="216" width="161" height="74" rx="8" fill="#1e1e1e" stroke="#4a5568" stroke-width="2"/><text x="466.5" y="247.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Secrets</text><text x="466.5" y="267.0" text-anchor="middle" font-size="12.5" fill="#b5b5b5">Vault, short-lived creds</text><rect x="559" y="216" width="161" height="74" rx="8" fill="#1e1e1e" stroke="#4a5568" stroke-width="2"/><text x="639.5" y="247.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Observability</text><text x="639.5" y="267.0" text-anchor="middle" font-size="12.5" fill="#b5b5b5">Prometheus, Grafana</text><line x1="380" y1="290" x2="380" y2="318" stroke="#00ffe0" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="320" width="680" height="70" rx="8" fill="#1e1e1e" stroke="#4a5568" stroke-width="2"/><text x="380.0" y="349.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Cloud and runtime</text><text x="380.0" y="369.0" text-anchor="middle" font-size="12.5" fill="#b5b5b5">AWS, GCP, Kubernetes (GKE)</text><text x="380" y="410" text-anchor="middle" font-size="11" fill="#8a8a8a"> </text></svg>