<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, Arial, sans-serif"><title id="t">GitHub Actions OIDC to AWS</title><desc id="d">A workflow job requests an OIDC token from GitHub, exchanges it with AWS STS for short-lived credentials, and uses them to access AWS resources.</desc><rect width="760" height="300" rx="12" fill="#121212"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00ffe0"/></marker></defs><rect x="30" y="40" width="190" height="80" rx="8" fill="#1e1e1e" stroke="#00ffe0" stroke-width="2"/><text x="125.0" y="74.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Workflow job</text><text x="125.0" y="94.0" text-anchor="middle" font-size="12.5" fill="#b5b5b5">permissions: id-token: write</text><rect x="285" y="40" width="190" height="80" rx="8" fill="#1e1e1e" stroke="#4a5568" stroke-width="2"/><text x="380.0" y="74.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">GitHub OIDC provider</text><text x="380.0" y="94.0" text-anchor="middle" font-size="12.5" fill="#b5b5b5">Signed JWT (repo, ref, env)</text><rect x="540" y="40" width="190" height="80" rx="8" fill="#1e1e1e" stroke="#4a5568" stroke-width="2"/><text x="635.0" y="74.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">AWS STS</text><text x="635.0" y="94.0" text-anchor="middle" font-size="12.5" fill="#b5b5b5">AssumeRoleWithWebIdentity</text><rect x="540" y="190" width="190" height="80" rx="8" fill="#1e1e1e" stroke="#4a5568" stroke-width="2"/><text x="635.0" y="224.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">AWS resources</text><text x="635.0" y="244.0" text-anchor="middle" font-size="12.5" fill="#b5b5b5">S3, ECR, EKS, ...</text><rect x="30" y="190" width="190" height="80" rx="8" fill="#1e1e1e" stroke="#00ffe0" stroke-width="2"/><text x="125.0" y="224.0" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Short-lived creds</text><text x="125.0" y="244.0" text-anchor="middle" font-size="12.5" fill="#b5b5b5">Expire after the job</text><line x1="220" y1="80" x2="285" y2="80" stroke="#00ffe0" stroke-width="2" marker-end="url(#a)"/><text x="252" y="68" text-anchor="middle" font-size="11" fill="#b5b5b5">1 request</text><line x1="475" y1="80" x2="540" y2="80" stroke="#00ffe0" stroke-width="2" marker-end="url(#a)"/><text x="508" y="68" text-anchor="middle" font-size="11" fill="#b5b5b5">2 present</text><line x1="635" y1="120" x2="635" y2="150" stroke="#00ffe0" stroke-width="2"/><line x1="635" y1="150" x2="125" y2="150" stroke="#00ffe0" stroke-width="2"/><line x1="125" y1="150" x2="125" y2="188" stroke="#00ffe0" stroke-width="2" marker-end="url(#a)"/><text x="380" y="144" text-anchor="middle" font-size="11" fill="#b5b5b5">3 trust policy checks sub / aud, returns credentials</text><line x1="220" y1="230" x2="540" y2="230" stroke="#00ffe0" stroke-width="2" marker-end="url(#a)"/><text x="380" y="222" text-anchor="middle" font-size="11" fill="#b5b5b5">4 call AWS APIs</text></svg>